<!DOCTYPE html>
<html lang="{{.Locale}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="container">
        <div class="lang-switcher">
            {{range .Languages}}
            <a href="{{if eq .Code "es"}}/{{else}}/{{.Code}}{{end}}"
               {{if eq .Code $.Locale}}class="active"{{end}}>{{.Name}}</a>
            {{end}}
        </div>
        <main>
            {{template "content" .}}
        </main>
    </div>
</body>

</html>
