{{define "content"}}
<div class="container" style="padding: 2rem 0;">
    <table
        style="width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #eee; font-family: 'Inter', sans-serif;">
        <thead style="background: #f4f4f4;">
            <tr>
                <th style="padding: 12px; text-align: left; border-bottom: 2px solid #ddd;">Datum</th>
                <th style="padding: 12px; text-align: left; border-bottom: 2px solid #ddd;">Závod</th>
                <th style="padding: 12px; text-align: left; border-bottom: 2px solid #ddd;">Lokalita</th>
                <th style="padding: 12px; text-align: center; border-bottom: 2px solid #ddd;">Odkaz</th>
            </tr>
        </thead>
        <tbody>
            {{range .Races}}
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 12px; white-space: nowrap; font-family: monospace; color: #d35400;">
                    {{.DateFormatted}}</td>
                <td style="padding: 12px;">
                    <div style="font-weight: bold;">{{.Name}}</div>
                    <div style="font-size: 0.8em; color: #777;">{{.TypeCZ}}</div>
                </td>
                <td style="padding: 12px;">
                    <div>{{.Island}}</div>
                </td>
                <td style="padding: 12px; text-align: center;">
                    <a href="{{.URL}}" target="_blank"
                        style="color: #3498db; text-decoration: none; font-weight: bold;">Odkaz</a>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
